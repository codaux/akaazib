---
deployment:
  tasks:
    - export REPOPATH=/home/cp42689/Akaazib
    - export DEPLOYPATH=/home/cp42689/public_html/
    - export LOGPATH=/home/cp42689/akaazib-deploy.log
    - /bin/date > $LOGPATH
    - echo "Akaazib deploy started" >> $LOGPATH
    - cd $REPOPATH && if [ -x /opt/alt/php85/usr/bin/php ]; then PHPBIN=/opt/alt/php85/usr/bin/php; elif [ -x /opt/cpanel/ea-php85/root/usr/bin/php ]; then PHPBIN=/opt/cpanel/ea-php85/root/usr/bin/php; else PHPBIN=php; fi; $PHPBIN -v >> $LOGPATH 2>&1
    - cd $REPOPATH && if [ -x /opt/alt/php85/usr/bin/php ]; then PHPBIN=/opt/alt/php85/usr/bin/php; elif [ -x /opt/cpanel/ea-php85/root/usr/bin/php ]; then PHPBIN=/opt/cpanel/ea-php85/root/usr/bin/php; else PHPBIN=php; fi; if [ -f /opt/cpanel/composer/bin/composer ]; then COMPOSER="/opt/cpanel/composer/bin/composer"; elif [ -f /usr/local/bin/composer ]; then COMPOSER="/usr/local/bin/composer"; elif [ -f /usr/bin/composer ]; then COMPOSER="/usr/bin/composer"; else COMPOSER="/home/cp42689/composer.phar"; [ -f "$COMPOSER" ] || $PHPBIN -r "copy('https://getcomposer.org/composer-stable.phar', '$COMPOSER');"; fi; COMPOSER_HOME=/home/cp42689/.composer COMPOSER_MEMORY_LIMIT=-1 $PHPBIN $COMPOSER install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress >> $LOGPATH 2>&1
    - cd $REPOPATH && if [ -x /opt/alt/php85/usr/bin/php ]; then PHPBIN=/opt/alt/php85/usr/bin/php; elif [ -x /opt/cpanel/ea-php85/root/usr/bin/php ]; then PHPBIN=/opt/cpanel/ea-php85/root/usr/bin/php; else PHPBIN=php; fi; $PHPBIN artisan optimize:clear >> $LOGPATH 2>&1
    - cd $REPOPATH && if [ -x /opt/alt/php85/usr/bin/php ]; then PHPBIN=/opt/alt/php85/usr/bin/php; elif [ -x /opt/cpanel/ea-php85/root/usr/bin/php ]; then PHPBIN=/opt/cpanel/ea-php85/root/usr/bin/php; else PHPBIN=php; fi; $PHPBIN artisan config:cache >> $LOGPATH 2>&1
    - cd $REPOPATH && if [ -x /opt/alt/php85/usr/bin/php ]; then PHPBIN=/opt/alt/php85/usr/bin/php; elif [ -x /opt/cpanel/ea-php85/root/usr/bin/php ]; then PHPBIN=/opt/cpanel/ea-php85/root/usr/bin/php; else PHPBIN=php; fi; $PHPBIN artisan view:cache >> $LOGPATH 2>&1
    - /bin/test -f $DEPLOYPATH/.htaccess || /bin/cp public/.htaccess $DEPLOYPATH/.htaccess
    - /bin/cp cpanel-public-index.php $DEPLOYPATH/index.php
    - /bin/cp cpanel-health.php $DEPLOYPATH/cpanel-health.php
    - /bin/chmod 755 $DEPLOYPATH
    - /bin/chmod 644 $DEPLOYPATH/index.php
    - /bin/chmod 644 $DEPLOYPATH/.htaccess
    - /bin/chmod 644 $DEPLOYPATH/cpanel-health.php
    - /bin/ls -la $DEPLOYPATH/index.php $DEPLOYPATH/.htaccess $DEPLOYPATH/cpanel-health.php >> $LOGPATH 2>&1
    - /bin/cp -R public/css $DEPLOYPATH
    - /bin/cp -R public/fonts $DEPLOYPATH
    - /bin/cp -R public/img $DEPLOYPATH
    - /bin/cp -R public/js $DEPLOYPATH
    - /bin/cp -R public/logo $DEPLOYPATH
    - /bin/cp public/data.json $DEPLOYPATH
    - /bin/cp public/deploy-check.txt $DEPLOYPATH
    - /bin/cp public/favicon.ico $DEPLOYPATH
    - /bin/cp public/google48a8d96a2360d52e.html $DEPLOYPATH
    - /bin/cp public/mix-manifest.json $DEPLOYPATH
    - /bin/cp public/robots.txt $DEPLOYPATH
    - /bin/cp public/web.config $DEPLOYPATH
    - echo "Akaazib deploy completed" >> $LOGPATH
